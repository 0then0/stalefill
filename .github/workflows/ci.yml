name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  client-compat:
    uses: ./.github/workflows/client-compat.yml
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
        server:
          - { image: 'redis:8.10.2-alpine', cli: redis-cli }
          - { image: 'valkey/valkey:9.1.2-alpine', cli: valkey-cli }
    services:
      cache:
        image: ${{ matrix.server.image }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "${{ matrix.server.cli }} ping"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
        env:
          REDIS_TEST_ADDR: 127.0.0.1:6379
